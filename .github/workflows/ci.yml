name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # before pytest: tests/test_patterns.py runs the catalogue on node too
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: lint
        run: ruff check .
      - name: types
        run: mypy app brief_bar
      - name: fixture corpus + api (mock judge, deterministic)
        run: pytest
      - name: document import boundaries and extraction
        run: node --test tests/site/*.test.mjs
