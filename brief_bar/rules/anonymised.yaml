id: anonymised
title: The brief is anonymised and blind-safe
rationale: >
  The Directory is blind: teams respond to substance, not brand. A brief that
  leaks the company, named people, contact details, or personal data breaks the
  fairness of blind review and can expose data it shouldn't. This is a hard
  publication requirement.
weight: 8
severity: high
gate: pass
# Blindness is a property of the Directory noticeboard, not of briefs in
# general — the rule (and its gate entry) deactivates with the directory
# context.
context: directory
applies_to: [brief]
criteria: >
  The brief contains no company/brand names, no named individuals, no contact
  details (emails, phones, URLs), and no personal data. Judge identity, not
  specificity: describing what the business does, its sector, its size, its
  volumes, or its numbers is REQUIRED elsewhere in this ruleset and never
  fails here — "we distribute chilled goods on forty daily routes" names no
  one. Laws, regulations, standards and certifications are not brands: GDPR,
  the AVG/RGPD/DSGVO translations of it, WCAG, HACCP, ISO numbers, RGAA and
  their national equivalents all pass, and naming the compliance regime is
  what the data-compliance rule asks for. Public authorities and regulators
  named generically ("the national food authority") pass; naming the specific
  company, its brands, its products or its people fails. Commodity tools the
  team happens to use (a spreadsheet, a messenger) are noise, not identity —
  prefer them written generically, but they do not fail this rule on their
  own. Fail only when a reader could identify WHO wrote the brief.
pass_examples:
  - "Integrates with the existing payment provider; the client is a regional hospitality group."
  - "We distribute chilled goods on forty daily routes from two warehouses to about a thousand shops; signatures are personal data and handled under GDPR; the screens target WCAG 2.2 AA."
fail_examples:
  - "We're Acme Srl; contact mara.rossi@acme.it; integrates with our Stripe account."
  - "The rota for our two Bergamo sites is kept by Giulia in reception; ask her for it."
references:
  - tier: practice
    title: "Blind review reduces bias"
    locator: "responders judge substance, not identity"
    url: https://en.wikipedia.org/wiki/Blind_experiment
  - tier: standard
    title: "GDPR — data minimisation (Art. 5)"
    locator: "don't expose personal data you don't need"
    url: https://gdpr-info.eu/art-5-gdpr/
owners: ["@welance/brief-bar"]
version: 2
