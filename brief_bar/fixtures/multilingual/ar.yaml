input: '# التوفر الآني لحجوزات المطاعم المستقلة


  المشكلة: تخسر المطاعم الصغيرة حجوزات لأن الموظفين لا يستطيعون تحديث التوفر عبر
  القنوات آنيًا. المستخدمون الأساسيون: مسؤولو الورديات في المطاعم المستقلة، يحدّثون
  عبر الهاتف أثناء الخدمة. النجاح: خفض حجوزات عدم الحضور بنسبة 30% خلال موسمين.
  المخرجات: تسجيل دخول موثّق بالبريد الإلكتروني وSPID، وجلسات محفوظة في Postgres،
  ونقطة نهاية API للتوفر بزمن p95 أقل من 200 ملّي ثانية. خارج النطاق: التطبيقات
  الأصلية والمدفوعات في الإصدار الأول. نطاق الميزانية 25-40 ألفًا. الجدول الزمني:
  تسليم المنتج الأولي قبل موسم الربيع. يلزم مطوّر متكامل ومصمم منتج لنحو ثمانية
  أسابيع. مبني على حزمة Next.js وPostgres الحالية؛ يتكامل مع مزوّد المدفوعات الحالي.
  المخاطرة: قد لا تُبقي المطاعم التوفر محدّثًا، لذا نتحقق من ذلك أولًا. يخزّن سجلّ
  حجوزات العملاء؛ الأساس القانوني في GDPR هو العقد؛ ويلزم اتفاق معالجة بيانات. صفحة
  الحجز العامة تستهدف WCAG 2.2 AA، مختبرة بلوحة المفاتيح وقارئ الشاشة.'
notes: Faithful ar translation of 0003-accepted — same content, same expectations
  as en.yaml, judged live.
