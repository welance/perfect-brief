input: '# آزاد ریستورانوں کی بکنگ کے لیے حقیقی وقت میں دستیابی


  مسئلہ: چھوٹے ریستوران بکنگ کھو دیتے ہیں کیونکہ عملہ تمام چینلز پر دستیابی حقیقی
  وقت میں اپ ڈیٹ نہیں کر سکتا۔ بنیادی صارفین: آزاد ریستورانوں کے شفٹ منیجر، جو سروس
  کے دوران موبائل سے اپ ڈیٹ کرتے ہیں۔ کامیابی: دو سیزن کے اندر نو شو بکنگ 30% کم
  کرنا۔ ڈیلیوریبلز: ای میل اور SPID کے ساتھ ایک تصدیقی لاگ اِن، Postgres میں محفوظ
  سیشن، اور دستیابی کا ایک API اینڈ پوائنٹ جس کا p95 دو سو ملی سیکنڈ سے کم ہو۔ دائرے
  سے باہر: v1 میں نیٹو ایپس اور ادائیگیاں۔ بجٹ کی حد 25-40 ہزار۔ ٹائم لائن: بہار
  کے سیزن سے پہلے MVP جاری کرنا۔ تقریباً آٹھ ہفتوں کے لیے ایک فل اسٹیک ڈویلپر اور
  ایک پروڈکٹ ڈیزائنر درکار۔ موجودہ Next.js اور Postgres اسٹیک پر بنایا گیا؛ موجودہ
  پیمنٹ فراہم کنندہ سے مربوط۔ خطرہ: ریستوران شاید دستیابی تازہ نہ رکھیں، لہٰذا پہلے
  ہم یہی جانچتے ہیں۔ گاہکوں کی بکنگ ہسٹری محفوظ ہوتی ہے؛ GDPR کی قانونی بنیاد معاہدہ
  ہے؛ DPA درکار ہے۔ عوامی بکنگ صفحہ WCAG 2.2 AA کا ہدف رکھتا ہے، کی بورڈ اور اسکرین
  ریڈر سے آزمودہ۔'
