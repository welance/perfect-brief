id: 0008-real-sensitive-data-it
input_type: brief
input: |
  # Architetto edge per centri benessere con AI locale

  Progettiamo dispositivi per centri benessere (cabine di galleggiamento, saune, postazioni di rilassamento guidato) che raccolgono dati e rispondono in tempo reale. Per la privacy dei dati e il funzionamento offline, l'elaborazione resta in locale, senza cloud pubblico.

  Cerchiamo chi progetti il server locale di ogni centro: raccolta dati dai dispositivi (MQTT/REST), modelli AI in locale (Ollama/vLLM), rete separata tra dispositivi e Wi-Fi ospiti, installazione replicabile con Docker e Ansible.

  Competenze: Linux, Docker Compose, PostgreSQL, VLAN, firewall, WireGuard, MQTT. Protezione dei dati sensibili/biometrici.

  Città: Bologna · meglio se vicino
  Durata stimata: qualche mese o anno
  Budget: tra 10000 - 30000 €
expected: {min: 65, max: 82}
expected_decision: reserved
expected_verdicts:
  anonymised: pass
  budget-floor: pass
  data-compliance: pass
notes: >
  A synthetic Italian brief, modelled on a public listing, (no personal data). "tra 10000 - 30000 €" is an amount
  range, not a phone; "dati sensibili/biometrici" is personal data, so data-
  compliance applies (and passes on "privacy dei dati").
