<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Price · the split calculator — welance</title>
<meta name="description" content="How much of the client rate goes to the independent — welance's split rule as a calculator anyone can use and check.">
<script>/* theme before paint: no flash of the wrong one */
(function(){try{var t=localStorage.getItem("welance-theme");
if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="stylesheet" href="welance.css">
<script src="pricing.js"></script>
<script src="i18n.js"></script>
<script src="i18n/de.js"></script>
<script src="i18n/it.js"></script>
<script src="i18n/ur.js"></script>
<script src="i18n/pt-BR.js"></script>
<script src="i18n/vi.js"></script>
<script src="i18n/ar.js"></script>
<script src="i18n/es.js"></script>
<script src="chrome.js"></script>
<style>
  /* tokens, fonts, logo come from welance.css (welance/Directory DNA).
     The names below are this page's original component vocabulary, kept and
     aliased onto the shared tokens so the calculator reads the same as
     console.html and rules.html. Light-only, like the rest of the site.
     (--partial and --mono come straight from welance.css.) */
  :root {
    --bg: var(--paper); --surface: var(--paper); --surface-2: var(--paper-2);
    --ink-2: var(--ink-soft); --ink-3: var(--ink-soft);
    --line: var(--rule); --line-strong: var(--rule);
    --person: var(--wl-c); --person-soft: var(--fail-bg);
    --company: var(--rule-strong); --company-soft: var(--pass-bg);
    --geo: var(--wl-p); --geo-soft: var(--accent-bg);
    --full: var(--pass); --none: #8a8a8a; --focus: var(--accent);
    --shadow: none;
    --serif: var(--disp); --sans: var(--disp);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px 72px; }
  .wrap > header { padding: 20px 0 18px; border-bottom: 2px solid var(--ink); margin-bottom: 24px; }

  /* Directory DNA is square */
  .card, .splitbar, .formula, .growth li, .verdict, .warn, .addbtn,
  .figures, .fig, .mode, .lang, .rung, .levelbadge .chip,
  input[type="text"], input[type="number"], select { border-radius: 0; }

  .topbar { display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; margin: 14px 0 20px; }
  .head-grid { display: flex; gap: 32px; align-items: flex-start; justify-content: space-between; }
  .head-grid .txt { min-width: 0; }
  .p-ident { flex: none; width: 210px; margin-top: 26px; }
  .p-ident svg { display: block; width: 100%; }
  .pd { fill: none; stroke-linecap: round; stroke-dasharray: 300; stroke-dashoffset: 300;
    animation: p-draw 1s cubic-bezier(.6,0,.3,1) forwards; }
  .pd.d1 { animation-delay: .1s; } .pd.d2 { animation-delay: .3s; } .pd.d3 { animation-delay: .5s; }
  .pd.d4 { animation-delay: .7s; } .pd.d5 { animation-delay: .85s; } .pd.d6 { animation-delay: 1.05s; }
  @keyframes p-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .pd { animation: none; stroke-dashoffset: 0; } }
  @media (max-width: 700px) { .p-ident { display: none; } }
  /* the reset sits with what it resets, not above the whole page */
  .cardfoot { display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 10px; margin-top: 14px; }
  .cardfoot .addbtn { margin-top: 0; }
  .lang.reset { font: inherit; font-size: 12.5px; padding: 6px 11px; cursor: pointer;
    background: var(--surface); color: var(--ink-2); border: 1px dashed var(--line-strong); }
  .lang.reset:hover { color: var(--person); border-color: var(--person); }
  .lang[aria-pressed="true"] { background: var(--company); border-color: var(--company); color: #fff; }

  .eyebrow { font-size: 11.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; margin: 0 0 10px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(29px, 4.4vw, 42px);
    line-height: 1.12; margin: 0 0 12px; text-wrap: balance; letter-spacing: -.01em; }
  .lede { margin: 0 0 28px; color: var(--ink-2); max-width: 66ch; font-size: 16.5px; }

  .cols { display: grid; grid-template-columns: minmax(0,1.32fr) minmax(0,1fr); gap: 26px; align-items: start; }
  @media (max-width: 920px) { .cols { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--line);
    border-radius: 0; padding: 22px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 20px; }
  .card h2 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0 0 4px; }
  .card .hint { margin: 0 0 18px; color: var(--ink-3); font-size: 13.5px; }
  .card.quiet { background: transparent; box-shadow: none; border-style: dashed; }
  summary { font-family: var(--serif); font-size: 16.5px; font-weight: 600; cursor: pointer;
    list-style: none; display: flex; align-items: center; gap: 9px; color: var(--ink-2); }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; font-family: var(--mono); font-size: 15px;
    color: var(--ink-3); width: 14px; text-align: center; }
  details[open] summary::before { content: "\2212"; }
  details[open] summary { color: var(--ink); margin-bottom: 4px; }
  details > .hint { margin-top: 10px; }
  .sticky { position: sticky; top: 18px; }
  @media (max-width: 920px) { .sticky { position: static; } }

  .rolebar { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .subnote { font-size: 12px; color: var(--ink-3); }
  .field label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; }
  input[type="text"], input[type="number"], select {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line-strong); border-radius: 0; padding: 8px 10px; }
  input[type="number"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .grow { flex: 1 1 200px; }
  .w-rate { width: 124px; }
  :is(input, select, button, [tabindex]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .comp-head, .comp { display: grid;
    grid-template-columns: minmax(0,1fr) 44px 90px 90px 58px 26px; gap: 8px; align-items: center; }
  .comp-head { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; padding: 0 0 8px; border-bottom: 1px solid var(--line); }
  .comp { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .comp:last-of-type { border-bottom: 0; }
  .comp input[type="text"] { width: 100%; }
  .comp input[type="number"] { width: 100%; text-align: center; }
  .comp select { width: 100%; font-size: 13px; padding: 7px 6px; }
  .comp input[type="number"] { padding: 7px 4px; }
  @media (max-width: 620px) {
    .comp-head { display: none; }
    .comp { grid-template-columns: 42px minmax(0,1fr) minmax(0,1fr) 52px 26px;
      gap: 6px; padding: 9px 0; }
    .comp > :first-child { grid-column: 1 / -1; }
    .comp select { font-size: 12.5px; padding: 6px 4px; }
    .comp input[type="text"] { padding: 7px 9px; }
    .comp input[type="number"] { padding: 6px 2px; font-size: 13.5px; }
    .cov { font-size: 12.5px; gap: 4px; }
    .wrap { padding: 20px 13px 48px; }
    .card { padding: 16px 14px; }
    .card + .card { margin-top: 14px; }
    .cols { gap: 16px; }
    .rolebar { gap: 10px; margin-bottom: 15px; }
    .subnote { font-size: 12px; color: var(--ink-3); }
  .field label { font-size: 10px; letter-spacing: .07em; }
    .w-rate { width: 100px; }
    .grow { flex: 1 1 140px; }
    .lede { font-size: 15.5px; margin-bottom: 20px; }
    .figures { grid-template-columns: 1fr 1fr; }
    .fig { padding: 11px 12px; }
    .fig .v { font-size: 18px; }
    .mode { font-size: 12.5px; padding: 6px 11px; }
    }

  .cov { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13.5px;
    font-weight: 600; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.f { background: var(--full); } .dot.p { background: var(--partial); } .dot.n { background: var(--none); }

  .iconbtn { background: none; border: 1px solid transparent; color: var(--ink-3);
    border-radius: 0; cursor: pointer; font-size: 17px; line-height: 1; padding: 5px 7px; }
  .iconbtn:hover { color: var(--person); border-color: var(--line-strong); }
  .rowflag { grid-column: 1 / -1; margin: 6px 0 0; font-size: 12.5px; color: var(--partial); }
  .addbtn { margin-top: 14px; background: var(--surface-2); border: 1px dashed var(--line-strong);
    color: var(--ink-2); border-radius: 0; padding: 9px 14px; cursor: pointer; font: inherit; font-size: 14px; }
  .addbtn:hover { border-color: var(--person); color: var(--person); }

  .levelbadge { display: flex; align-items: center; gap: 9px; font-family: var(--serif);
    font-size: 24px; font-weight: 600; margin: 0 0 3px; }
  .levelbadge .chip { width: 11px; height: 31px; border-radius: 0; background: var(--person); flex: none; }
  .levelsub { color: var(--ink-3); font-size: 13.5px; margin: 0 0 20px; }
  .coverline { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .coverline .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .coverline .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; }
  .ladder { display: flex; gap: 3px; margin-bottom: 22px; }
  .rung { flex: 1; height: 5px; border-radius: 0; background: var(--surface-2); }
  .rung.on { background: var(--person); }

  .splitbar { display: flex; height: 42px; border-radius: 0; overflow: hidden; border: 1px solid var(--line-strong); }
  .splitbar > div { display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px;
    font-weight: 600; color: #fff; min-width: 0; overflow: hidden; transition: flex-basis .25s ease; }
  .sb-person { background: var(--person); } .sb-geo { background: var(--geo); } .sb-company { background: var(--company); }
  .splitkey { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-3); margin-top: 8px; }
  .splitkey span { display: flex; align-items: center; gap: 5px; }
  .sw { width: 9px; height: 9px; border-radius: 0; flex: none; }

  .figures { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line);
    border: 1px solid var(--line); border-radius: 0; overflow: hidden; margin-top: 20px; }
  .fig { background: var(--surface); padding: 13px 14px; }
  .fig .k { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 3px; }
  .fig .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .fig .v small { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
  .fig.geo .v { color: var(--geo); }

  .formula { margin-top: 18px; background: var(--surface-2); border-radius: 0; padding: 13px 15px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.75; color: var(--ink-2); overflow-x: auto; }
  .formula b { color: var(--ink); font-weight: 600; }

  .growth { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .growth li { display: flex; gap: 11px; align-items: baseline; padding: 11px 13px;
    background: var(--surface-2); border-radius: 0; border-inline-start: 3px solid var(--person); font-size: 14.5px; }
  .growth .gain { margin-inline-start: auto; font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-weight: 600; color: var(--person); white-space: nowrap; }
  .allset { color: var(--full); font-size: 14.5px; margin: 0; }

  .modes { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .mode { font: inherit; font-size: 13.5px; padding: 7px 13px; cursor: pointer;
    background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 0; }
  .mode[aria-pressed="true"] { background: var(--company); border-color: var(--company); color: #fff; }

  .verdict { margin: 16px 0 0; padding: 13px 15px; border-radius: 0; font-size: 14.5px; }
  .verdict.ok { background: var(--company-soft); } .verdict.no { background: var(--person-soft); }
  .verdict b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .switch { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 14.5px; }
  .switch input { width: 17px; height: 17px; accent-color: var(--geo); }

  .warn { margin: 16px 0 0; padding: 13px 15px; border-radius: 0; background: var(--geo-soft);
    font-size: 13.5px; color: var(--ink); border-inline-start: 3px solid var(--geo); }
  .warn b { font-weight: 600; }

  .levels-ref { width: 100%; border-collapse: collapse; font-size: 14px; }
  .levels-ref th, .levels-ref td { text-align: start; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .levels-ref th { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .levels-ref td:nth-child(n+2) { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: end; }
  .levels-ref tr.here td { background: var(--surface-2); font-weight: 600; }
  .levels-ref tr:last-child td { border-bottom: 0; }
  .tablewrap { overflow-x: auto; }

  .wrap footer { margin-top: 34px; color: var(--ink-3); font-size: 13px; max-width: 76ch; }
  .wrap footer p { margin: 0 0 9px; }
  .wrap footer b { color: var(--ink-2); }

  [dir="rtl"] .growth li { border-inline-start: 3px solid var(--person); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="site-header"></div>
<p class="wl-crumb"><span class="dot"></span><span class="cur">perfect price</span></p>
<div class="wrap">
  

  <header>
    <div class="head-grid">
      <div class="txt">
        <p class="eyebrow" id="t-eyebrow"></p>
        <h1 id="t-title"></h1>
        <p class="lede" id="t-lede" style="margin-bottom:0"></p>
      </div>
      <div class="p-ident" role="img" aria-label="A client rate split into visible bands">
        <svg viewBox="0 0 220 120" aria-hidden="true">
          <path class="pd d1" d="M10 34 h200 v34 h-200 z" stroke="var(--ink)" stroke-width="3" fill="none"/>
          <path class="pd d2" d="M132 34 v34 M164 34 v34" stroke="var(--ink)" stroke-width="3" fill="none"/>
          <path class="pd d3" d="M18 51 h104" stroke="var(--person)" stroke-width="10"/>
          <path class="pd d4" d="M139 51 h18" stroke="var(--geo)" stroke-width="10"/>
          <path class="pd d5" d="M171 51 h32" stroke="var(--company)" stroke-width="10"/>
          <circle class="pd d6" cx="196" cy="18" r="11" stroke="var(--wl-y)" stroke-width="3" fill="none"/>
          <path class="pd d6" d="M196 12 v12 M191 15 h10 M191 21 h10" stroke="var(--ink)" stroke-width="2" fill="none"/>
          <path class="pd d6" d="M10 86 h60 M10 98 h44" stroke="var(--ink-soft)" stroke-width="2.5" fill="none"/>
        </svg>
      </div>
    </div>
  </header>

  <div class="cols">
    <div>
      <section class="card">
        <h2 id="t-roleh"></h2>
        <p class="hint" id="t-rolehint"></p>
        <div class="rolebar">
          <div class="field grow"><label id="t-l-role" for="rolename"></label>
            <input type="text" id="rolename">
            <span class="subnote" id="t-providersub"></span></div>
          <div class="field" id="fld-rate"><label id="t-l-rate" for="rate"></label>
            <input type="number" id="rate" class="w-rate" value="100" min="0" step="0.5"></div>
          <div class="field" id="fld-cap"><label id="t-l-cap" for="capr"></label>
            <input type="number" id="capr" class="w-rate" value="50" min="0" step="0.5"></div>
        </div>
        <div class="modes" style="margin-bottom:10px">
          <button class="mode" id="w-client" type="button" aria-pressed="true"></button>
          <button class="mode" id="w-internal" type="button" aria-pressed="false"></button>
        </div>
        <p class="subnote" id="t-ratesnote" style="max-width:66ch;margin:0 0 18px"></p>
        <div class="comp-head">
          <div id="t-h-comp"></div><div id="t-h-weight"></div><div id="t-h-self"></div>
          <div id="t-h-eval"></div><div id="t-h-cov"></div><div></div>
        </div>
        <div id="rows"></div>
        <div class="cardfoot">
          <button class="addbtn" id="add" type="button"></button>
          <button class="lang reset" id="reset" type="button"></button>
        </div>
      </section>

      <section class="card">
        <h2 id="t-geoh"></h2>
        <p class="hint" id="t-geohint"></p>
        <label class="switch"><input type="checkbox" id="usegeo"><span id="t-usegeo"></span></label>
        <div class="rolebar">
          <div class="field grow"><label id="t-l-country" for="country"></label>
            <select id="country"></select></div>
          <div class="field"><label id="t-l-coef" for="coef"></label>
            <input type="number" id="coef" class="w-rate" min="0.1" max="2" step="0.01"></div>
          <div class="field"><label id="t-l-floor" for="floorc"></label>
            <input type="number" id="floorc" class="w-rate" min="0" max="1" step="0.05" value="0.5"></div>
        </div>
        <div id="geonote"></div>
      </section>

      <section class="card quiet">
        <details>
          <summary id="t-checkh"></summary>
          <p class="hint" id="t-checkhint"></p>
          <div class="rolebar">
            <div class="field"><label id="t-l-payout" for="payout"></label>
              <input type="number" id="payout" class="w-rate" value="50" min="0" step="0.5"></div>
          </div>
          <div id="verdict"></div>
        </details>
      </section>

      <section class="card">
        <h2 id="t-growthh"></h2>
        <p class="hint" id="t-growthhint"></p>
        <div id="growth"></div>
      </section>
    </div>

    <div class="sticky">
      <section class="card">
        <h2 id="t-resulth" style="margin-bottom:14px"></h2>
        <div class="levelbadge"><span class="chip"></span><span id="levelname">—</span></div>
        <p class="levelsub" id="levelsub">—</p>
        <div class="coverline"><span class="k" id="t-coverk"></span><span class="v" id="covpct">—</span></div>
        <div class="ladder" id="ladder"></div>
        <div class="splitbar">
          <div class="sb-person" id="barPerson"></div>
          <div class="sb-geo" id="barGeo"></div>
          <div class="sb-company" id="barCompany"></div>
        </div>
        <div class="splitkey" id="splitkey"></div>
        <div class="figures">
          <div class="fig"><div class="k" id="t-f-share"></div><div class="v" id="figShare">—</div></div>
          <div class="fig"><div class="k" id="t-f-margin"></div><div class="v" id="figMargin">—</div></div>
          <div class="fig"><div class="k" id="t-f-pay"></div><div class="v" id="figPay">—</div></div>
          <div class="fig"><div class="k" id="t-f-rate"></div><div class="v" id="figRate">—</div></div>
        </div>
        <div class="formula" id="formula"></div>
      </section>

      <section class="card">
        <h2 id="t-levelsh"></h2>
        <p class="hint" id="t-levelshint"></p>
        <div class="tablewrap">
          <table class="levels-ref">
            <thead><tr><th id="t-c-level"></th><th id="t-c-cov"></th><th id="t-c-share"></th><th id="t-c-margin"></th></tr></thead>
            <tbody id="levelsref"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <details class="fineprint"><summary id="t-fineprint">the fine print</summary>
    <footer id="footer"></footer>
  </details>
</div>

<script>
(function () {
  "use strict";

  var T = {
    en: {
      dir: "ltr", locale: "en-GB", name: "English",
      workh: "Type of work", wtClient: "Client work", wtInternal: "Internal work", capLbl: "Internal cap \u20ac/h", fCap: "Level ceiling", internalNote: "Internal work has no client rate \u2014 there is nothing to take a share of. The ceiling is {cap}/h at the top level, scaled down by level.",
      ratesNote: "The default rates are welance's own — every firm will set theirs. Stated honestly: we believe these are fair EU rates for today's digital professionals, whose roles are flattening into something more fluid and generalist — one role, really: the AI-powered digital professional.",
      askLbl: "Their asking rate \u20ac/h",
      provider: "provider", providerSub: "Independent — a freelancer or a small studio, up to about 25 people.",
      reset: "Reset to defaults",
      eyebrow: "the split rule",
      title: "How much of the client rate goes to the independent",
      lede: "The share depends on how much of the role the independent covers on its own — not on how much the client pays, and never on a judgement about who they are. List the parts of the role, mark who covers what, and the share follows. The independent may be one freelancer or a studio of up to about 25 people; the model does not care which.",
      roleh: "The role, part by part",
      rolehint: "For each part: the person's own view and the view of the most role-adjacent senior colleague. If the two are two steps apart, the calculation stops and it needs a conversation.",
      role: "Role", person: "Person",
      hComp: "Part", hWeight: "Weight", hSelf: "Self", hEval: "Reviewer", hCov: "Coverage",
      add: "+ Add part",
      full: "Full", partial: "Partial", none: "None",

                   vi: "Quan hệ khách hàng", ar: "علاقة العميل" },
          weight: 1, self: 0.5, evalr: 0.5 },
        { name: { en: "Infrastructure & pipelines", de: "Infrastruktur & Pipelines",
                   it: "Infrastruttura e pipeline", ur: "انفراسٹرکچر اور پائپ لائنز",
                   pt: "Infraestrutura e pipelines", es: "Infraestructura y pipelines",
                   vi: "Hạ tầng & pipeline", ar: "البنية التحتية وخطوط الأنابيب" },
          weight: 1, self: 0, evalr: 0 }
      ]
    },
    internal: {
      role: "Internal — knowledge base",
      comps: [
        { name: { en: "Maintain internal knowledge base", de: "Interne Wissensdatenbank pflegen",
                   it: "Manutenzione della knowledge base interna",
                   ur: "اندرونی نالج بیس کی دیکھ بھال",
                   pt: "Manter a base de conhecimento interna",
                   es: "Mantener la base de conocimiento interna",
                   vi: "Duy trì kho tri thức nội bộ",
                   ar: "صيانة قاعدة المعرفة الداخلية" },
          weight: 1, self: 1, evalr: 1 }
      ]
    }
  };

  function blankState() {
    return { dirty: { client: false, internal: false }, sets: {}, role: {}, io: {} };
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return blankState();
      var v = JSON.parse(raw);
      return (v && v.dirty) ? v : blankState();
    } catch (e) { return blankState(); }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = load();
  // The language is shared with the whole site (localStorage "welance-lang",
  // written by i18n.js on the other pages). This page's internal codes match
  // the site's except pt <-> pt-BR.
  var SITE_LANG_KEY = "welance-lang";
  function fromSite(code) { return code === "pt-BR" ? "pt" : code; }
  function toSite(code) { return code === "pt" ? "pt-BR" : code; }
  function siteLang() {
    try {
      var q = new URLSearchParams(location.search).get("lang");
      if (q && T[fromSite(q)]) return fromSite(q);
      var s2 = localStorage.getItem(SITE_LANG_KEY);
      if (s2 && T[fromSite(s2)]) return fromSite(s2);
    } catch (e) {}
    return null;
  }
  var lang = siteLang() ||
    (state.io && state.io.lang && T[state.io.lang] ? state.io.lang : "en");
  var work = state.io && state.io.work === "internal" ? "internal" : "client";
  var comps = [];

  // Defaults are language-aware, so an untouched set follows the UI language.
  function defaultComps(w) {
    return DEF[w].comps.map(function (c) {
      return { name: c.name[lang] || c.name.en, weight: c.weight, self: c.self, evalr: c.evalr };
    });
  }
  function loadSet(w) {
    if (state.dirty[w] && state.sets[w] && state.sets[w].length) {
      comps = state.sets[w].map(function (c) {
        return { name: c.name, weight: c.weight, self: c.self, evalr: c.evalr };
      });
      $("rolename").value = state.role[w] || DEF[w].role;
    } else {
      comps = defaultComps(w);
      $("rolename").value = DEF[w].role;
    }
  }
  function markDirty() {
    state.dirty[work] = true;
    state.sets[work] = comps.map(function (c) {
      return { name: c.name, weight: c.weight, self: c.self, evalr: c.evalr };
    });
    state.role[work] = $("rolename").value;
    save();
  }
  function saveIO() {
    state.io = {
      lang: lang, work: work,
      rate: $("rate").value, capr: $("capr").value, payout: $("payout").value,
      coef: $("coef").value, floorc: $("floorc").value,
      country: $("country").value, usegeo: $("usegeo").checked
    };
    save();
  }
  function applyIO() {
    var io = state.io || {};
    ["rate", "capr", "payout", "coef", "floorc"].forEach(function (k) {
      if (io[k] !== undefined && io[k] !== "") $(k).value = io[k];
    });
    if (io.country) $("country").value = io.country;
    $("usegeo").checked = !!io.usegeo;
  }

  var $ = function (id) { return document.getElementById(id); };
  var t = function () { return T[lang]; };
  function eur(n) {
    try { return new Intl.NumberFormat(t().locale, { style: "currency", currency: "EUR" }).format(n); }
    catch (e) { return "€" + n.toFixed(2); }
  }
  function pct(n) {
    try { return new Intl.NumberFormat(t().locale, { style: "percent", maximumFractionDigits: 0 }).format(n); }
    catch (e) { return Math.round(n * 100) + "%"; }
  }
  function fill(s, o) {
    return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k] !== undefined ? o[k] : ""; });
  }

  var agreed = P.agreed, coverageOf = P.coverageOf, levelFor = P.levelFor;
  function lvIndex(lv) { return LEVELS.indexOf(lv); }

  function geoCoef() {
    if (!$("usegeo").checked) return 1;
    // §7: max(coefficient, floor) — the same rule team.html uses.
    return P.applyCol(1, Number($("coef").value), Number($("floorc").value));
  }

  function renderStatic() {
    var d = t();
    document.documentElement.setAttribute("dir", d.dir);
    document.documentElement.setAttribute("lang", lang);
    var map = {
      "t-eyebrow": d.eyebrow, "t-title": d.title, "t-lede": d.lede,
      "t-roleh": d.roleh, "t-rolehint": d.rolehint,
      "t-l-role": d.role, "t-providersub": d.providerSub,
      "t-h-comp": d.hComp, "t-h-weight": d.hWeight, "t-h-self": d.hSelf,
      "t-h-eval": d.hEval, "t-h-cov": d.hCov, "add": d.add,
      "t-geoh": d.geoh, "t-geohint": d.geohint, "t-usegeo": d.usegeo,
      "t-l-country": d.country, "t-l-coef": d.coef, "t-l-floor": d.floorc,
      "t-checkh": d.checkh, "t-checkhint": d.checkhint,
      "w-client": d.wtClient, "w-internal": d.wtInternal, "t-l-cap": d.capLbl,
      "t-l-payout": d.askLbl, "t-l-rate": d.rate,
      "t-growthh": d.growthh, "t-growthhint": d.growthhint,
      "t-resulth": d.resulth, "t-coverk": d.coverk,
      "t-f-share": d.fShare, "t-f-margin": d.fMargin, "t-f-pay": d.fPay, "t-f-rate": d.fRate,
      "t-levelsh": d.levelsh, "t-levelshint": d.levelshint,
      "reset": d.reset,
      "t-c-level": d.cLevel, "t-c-cov": d.cCov, "t-c-share": d.cShare, "t-c-margin": d.cMargin,
      "t-ratesnote": d.ratesNote || "",
      "t-fineprint": d.finePrint || "the fine print"
    };
    Object.keys(map).forEach(function (k) { $(k).textContent = map[k]; });

    var f = $("footer");
    f.textContent = "";
    [d.f1, d.f2, d.f3, d.f4, d.f5, d.f6, d.f7].forEach(function (h) {
      var p = document.createElement("p"); p.innerHTML = h; f.appendChild(p);
    });

    var sel = $("country"), keep = sel.value;
    sel.textContent = "";
    COUNTRIES.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c.code; o.textContent = c[lang] + " · " + c.coef.toFixed(2);
      sel.appendChild(o);
    });
    sel.value = keep || "PK";
    if (!$("coef").value) $("coef").value = "0.28";
  }

  function stepSelect(val, onChange) {
    var d = t(), labels = [d.full, d.partial, d.none];
    var sel = document.createElement("select");
    STEPS.forEach(function (v, i) {
      var o = document.createElement("option");
      o.value = String(v); o.textContent = labels[i];
      if (v === val) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () { onChange(Number(sel.value)); });
    return sel;
  }

  function renderRows() {
    var host = $("rows");
    host.textContent = "";
    comps.forEach(function (c, i) {
      var row = document.createElement("div");
      row.className = "comp";

      var name = document.createElement("input");
      name.type = "text"; name.value = c.name; name.setAttribute("aria-label", t().hComp);
      name.addEventListener("input", function () { c.name = name.value; markDirty(); });
      row.appendChild(name);

      var w = document.createElement("input");
      w.type = "number"; w.min = "0"; w.step = "0.5"; w.value = String(c.weight);
      w.setAttribute("aria-label", t().hWeight);
      w.addEventListener("input", function () { c.weight = w.value; markDirty(); render(); });
      row.appendChild(w);

      row.appendChild(stepSelect(c.self, function (v) { c.self = v; markDirty(); render(); }));
      row.appendChild(stepSelect(c.evalr, function (v) { c.evalr = v; markDirty(); render(); }));

      var a = agreed(c);
      var cov = document.createElement("div");
      cov.className = "cov";
      var dot = document.createElement("span");
      dot.className = "dot " + (a === 1 ? "f" : a === 0.5 ? "p" : "n");
      cov.appendChild(dot);
      cov.appendChild(document.createTextNode(pct(a)));
      row.appendChild(cov);

      var del = document.createElement("button");
      del.type = "button"; del.className = "iconbtn"; del.textContent = "×";
      del.setAttribute("aria-label", "remove");
      del.addEventListener("click", function () { comps.splice(i, 1); markDirty(); render(); });
      row.appendChild(del);

      if (Math.abs(c.self - c.evalr) === 1) {
        var fl = document.createElement("p");
        fl.className = "rowflag"; fl.textContent = t().flag;
        row.appendChild(fl);
      }
      host.appendChild(row);
    });
  }

  function renderResult(cov, lv) {
    var d = t(), idx = lvIndex(lv), g = geoCoef();
    $("levelname").textContent = d.lv[idx];
    $("levelsub").textContent = d.lvSub[idx];
    $("covpct").textContent = pct(cov);

    var lad = $("ladder");
    lad.textContent = "";
    for (var i = 0; i < 8; i++) {
      var r = document.createElement("div");
      r.className = "rung" + (cov >= (i + 1) / 8 ? " on" : "");
      lad.appendChild(r);
    }

    var rate, pay, roleOnly;
    if (work === "internal") {
      // No client, so no share: the ceiling is the internal cap, scaled by level.
      var cap = Number($("capr").value) || INTERNAL_MAX;
      roleOnly = cap * (lv.share / LEVELS[0].share);
      pay = roleOnly * g;
      rate = 0;
    } else {
      rate = Number($("rate").value) || 0;
      roleOnly = rate * lv.share;
      pay = roleOnly * g;
    }
    var diff = roleOnly - pay;

    // For internal work the denominator is the top-level cap: what is missing
    // from 100% is not margin, it is welance support — the colleague who
    // trains or verifies the uncovered part until the person carries it alone.
    var base = work === "internal" ? (Number($("capr").value) || INTERNAL_MAX) : rate;
    var pShare = base > 0 ? pay / base : 0;
    var gShare = base > 0 ? diff / base : 0;
    $("barPerson").style.flexBasis = (pShare * 100) + "%";
    $("barGeo").style.flexBasis = (gShare * 100) + "%";
    $("barCompany").style.flexBasis = ((1 - pShare - gShare) * 100) + "%";
    $("barPerson").textContent = pct(pShare);
    $("barGeo").textContent = gShare > 0.06 ? pct(gShare) : "";
    $("barCompany").textContent = pct(Math.max(0, 1 - pShare - gShare));

    var key = $("splitkey");
    key.textContent = "";
    [[ "var(--person)", d.provider ],
     [ "var(--geo)", d.keyGeo ],
     [ "var(--company)", work === "internal" ? d.keySupport : d.keyCompany ]].forEach(function (pair, i) {
      if (i === 1 && gShare <= 0.0001) return;
      if (i === 2 && 1 - pShare - gShare <= 0.0001) return;
      var s = document.createElement("span");
      var sw = document.createElement("span");
      sw.className = "sw"; sw.style.background = pair[0];
      s.appendChild(sw); s.appendChild(document.createTextNode(pair[1]));
      key.appendChild(s);
    });

    // Internal work has no client and therefore no margin. At full autonomy the
    // person keeps the whole cap; below it, the remainder is welance support —
    // someone's real time spent training or verifying the uncovered part.
    var supportShare = 1 - lv.share / LEVELS[0].share;
    $("figShare").textContent = work === "internal"
      ? pct(lv.share / LEVELS[0].share) : pct(lv.share);
    $("t-f-margin").textContent = work === "internal" ? d.fSupport : d.fMargin;
    $("figMargin").textContent = work === "internal" ? pct(supportShare) : pct(1 - lv.share);
    $("figPay").innerHTML = eur(pay) + " <small>/h</small>";
    $("t-f-rate").textContent = work === "internal" ? d.fCap : d.fRate;
    $("figRate").innerHTML = work === "internal"
      ? eur(roleOnly) + " <small>/h</small>"
      : eur(rate) + " <small>/h</small>";

    $("formula").innerHTML =
      d.coverk + " = <b>" + pct(cov) + "</b> → " + d.cLevel + " <b>" + d.lv[idx] + "</b>" +
      (work === "internal" ? "" : " → " + d.cShare + " <b>" + pct(lv.share) + "</b>") + "<br>" +
      (work === "internal"
        ? d.fCap + " = " + eur(Number($("capr").value) || INTERNAL_MAX) + " × " +
          pct(lv.share / LEVELS[0].share) + " = <b>" + eur(roleOnly) + "</b>"
        : d.fPay + " ≤ " + eur(rate) + " × " + pct(lv.share) + " = <b>" + eur(roleOnly) + "</b>") +
      (g !== 1 ? "<br>× " + g.toFixed(2) + " → <b>" + eur(pay) + "</b>" : "");

    var ref = $("levelsref");
    ref.textContent = "";
    LEVELS.forEach(function (L, i2) {
      var tr = document.createElement("tr");
      if (i2 === idx) tr.className = "here";
      [d.lv[i2], pct(L.cover), pct(L.share), pct(1 - L.share)].forEach(function (txt) {
        var td = document.createElement("td"); td.textContent = txt; tr.appendChild(td);
      });
      ref.appendChild(tr);
    });

    return { rate: rate, pay: pay, roleOnly: roleOnly, diff: diff };
  }

  function renderGeoNote(v) {
    var d = t(), host = $("geonote");
    host.textContent = "";
    var p = document.createElement("p");
    p.className = "warn";
    if (!$("usegeo").checked) {
      p.textContent = d.geoOff;
    } else {
      var raw = Number($("coef").value) || 1;
      var floor = Number($("floorc").value) || 0;
      p.innerHTML = fill(d.geoOn, {
        full: eur(v.roleOnly), local: eur(v.pay), diff: eur(v.diff),
        pctdiff: v.roleOnly > 0 ? pct(v.diff / v.roleOnly) : "—"
      });
      if (raw < floor) {
        var s = document.createElement("div");
        s.style.marginTop = "7px";
        s.textContent = fill(d.geoFloor, { raw: eur(v.roleOnly * raw) });
        p.appendChild(s);
      }
    }
    host.appendChild(p);
  }

  function renderVerdict(lv, v) {
    var d = t(), host = $("verdict"), who = d.provider;
    host.textContent = "";
    var p = document.createElement("p"), ok;
    if (work === "internal") {
      var paid = Number($("payout").value) || 0;
      ok = paid <= v.pay + 0.005;
      p.className = "verdict " + (ok ? "ok" : "no");
      p.innerHTML = fill(d.internalNote, { cap: eur(Number($("capr").value) || INTERNAL_MAX) }) +
        " " + fill(ok ? d.okRate : d.noRate,
          { rate: eur(v.roleOnly), who: who, max: eur(v.pay), pay: eur(paid) });
      host.appendChild(p);
      return;
    }
    var asked = Number($("payout").value) || 0;
    ok = asked <= v.pay + 0.005;
    p.innerHTML = fill(ok ? d.okRate : d.noRate,
      { rate: eur(v.rate), who: who, max: eur(v.pay), pay: eur(asked) });
    p.className = "verdict " + (ok ? "ok" : "no");
    host.appendChild(p);
  }

  function renderGrowth(cov, lv, v) {
    var d = t(), host = $("growth");
    host.textContent = "";
    var gaps = comps.filter(function (c) { return agreed(c) < 1; });
    if (!gaps.length) {
      var done = document.createElement("p");
      done.className = "allset"; done.textContent = d.allset;
      host.appendChild(done);
      return;
    }
    var ul = document.createElement("ul");
    ul.className = "growth";
    gaps.forEach(function (c) {
      var trial = comps.map(function (x) {
        return x === c ? { weight: x.weight, self: 1, evalr: 1 } : x;
      });
      var nc = coverageOf(trial), nl = levelFor(nc);
      var gain = (nl.share - lv.share) * v.rate * geoCoef();
      var li = document.createElement("li");
      var txt = document.createElement("span");
      txt.textContent = fill(d.cover, {
        name: c.name || d.hComp, cov: pct(nc), lv: d.lv[lvIndex(nl)]
      });
      li.appendChild(txt);
      var g = document.createElement("span");
      g.className = "gain";
      g.textContent = gain > 0.005 ? "+" + eur(gain) + "/h" : d.sameLevel;
      li.appendChild(g);
      ul.appendChild(li);
    });
    host.appendChild(ul);
  }

  function render() {
    $("fld-rate").style.display = work === "internal" ? "none" : "";
    $("fld-cap").style.display = work === "internal" ? "" : "none";
    var cov = coverageOf(comps), lv = levelFor(cov);
    renderRows();
    var v = renderResult(cov, lv);
    renderGeoNote(v);
    renderVerdict(lv, v);
    renderGrowth(cov, lv, v);
  }

  $("add").addEventListener("click", function () {
    comps.push({ name: "", weight: 1, self: 1, evalr: 1 });
    markDirty(); render();
  });
  $("rolename").addEventListener("input", markDirty);
  ["rate", "payout", "coef", "floorc", "capr"].forEach(function (id) {
    $(id).addEventListener("input", function () { saveIO(); render(); });
  });
  $("usegeo").addEventListener("change", function () { saveIO(); render(); });
  $("country").addEventListener("change", function () {
    var c = COUNTRIES.filter(function (x) { return x.code === $("country").value; })[0];
    if (c) $("coef").value = String(c.coef);
    saveIO(); render();
  });
  function setWork(w) {
    work = w;
    $("w-client").setAttribute("aria-pressed", w === "client" ? "true" : "false");
    $("w-internal").setAttribute("aria-pressed", w === "internal" ? "true" : "false");
    loadSet(w); saveIO(); render();
  }
  $("w-client").addEventListener("click", function () { setWork("client"); });
  $("w-internal").addEventListener("click", function () { setWork("internal"); });
  $("reset").addEventListener("click", function () {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state = blankState();
    $("rate").value = "100"; $("capr").value = "50"; $("payout").value = "50";
    $("floorc").value = "0.5"; $("usegeo").checked = false;
    $("country").value = "PK"; $("coef").value = "0.28";
    setWork("client");
  });

  $("country").value = "PK";
  $("coef").value = "0.28";
  applyIO();
  $("w-client").setAttribute("aria-pressed", work === "client" ? "true" : "false");
  $("w-internal").setAttribute("aria-pressed", work === "internal" ? "true" : "false");
  loadSet(work);
  renderStatic();
  render();
  // the site-wide dropdown (chrome header) owns the language now
  document.addEventListener("welance:lang", function (ev) {
    var code = fromSite(ev.detail.lang);
    if (!T[code] || code === lang) return;
    lang = code;
    if (!state.dirty[work]) loadSet(work);   // untouched defaults follow the language
    saveIO(); renderStatic(); render();
  });
})();
</script>
<div id="site-footer"></div>
</body>
</html>
