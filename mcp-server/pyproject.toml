[project]
name = "perfect-brief-mcp"
version = "1.9.2"
description = "MCP server for The Brief Bar — score a digital product brief against an open, versioned ruleset your assistant cannot bend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "welance", email = "hello@welance.com" }]
keywords = ["mcp", "brief", "product", "scoring", "welance"]
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.urls]
Homepage = "https://briefs.welance.com"
Source = "https://github.com/welance/perfect-brief"

[project.scripts]
perfect-brief-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
