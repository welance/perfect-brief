[project]
name = "brief-bar-mcp"
version = "1.14.1"
description = "Perfect Brief MCP server (free, bring your own model): judge a digital product brief with your own model against an open, versioned ruleset; the bar's code does the arithmetic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "welance", email = "hello@welance.com" }]
keywords = ["mcp", "brief", "product", "scoring", "welance"]
dependencies = ["mcp>=2.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://briefs.welance.com"
Source = "https://github.com/welance/perfect-brief"

[project.scripts]
perfect-brief-mcp = "server:main"
brief-bar-mcp = "server:main"  # the original name, kept for existing configs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
