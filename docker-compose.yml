# briefs.welance.com — scoring service + its only stateful dependency (Redis cache).
# The service is stateless; Redis holds ephemeral verdict cache + rate-limit counters.
services:
  api:
    build: .
    image: welance/brief-bar:1.13.0
    # amd64 on purpose: the cluster is amd64, and on Apple silicon the arm64
    # build dies on import (cryptography wheels raise Illegal instruction under
    # Docker Desktop's VM). Emulated is slower; crashed is useless.
    platform: linux/amd64
    env_file: .env
    environment:
      PB_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # The image bakes in a copy of site/ (COPY site ./site), so without this
      # every front-end edit needs a full rebuild to be visible. Read-only bind:
      # a refresh is the whole feedback loop. Production runs the baked copy —
      # nothing mounts this — so the two never disagree about what shipped.
      - ./site:/srv/site:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    # cache only: no persistence, LRU eviction under memory pressure
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
